name: Noteworthy AI
description: Noteworthy AI is a Techstars-backed company delivering AI-powered grid inspection
  for electric utilities. Its Noteworthy Inspect product mounts smart cameras on utility fleet
  vehicles and applies computer-vision and machine-learning analytics to automatically identify
  pole defects, inventory grid components, and assess distribution-infrastructure conditions during
  routine operations, without dedicated inspection crews. Use cases span asset inventory and
  inspection, lighting audits, storm-damage assessment, vegetation management, and joint-use
  equipment tracking, helping utilities cut inspection operating costs while improving grid
  reliability and safety. Customers include FirstEnergy, NextEra Energy, Exelon, Xcel Energy,
  Alabama Power, and Georgia Power; technology partners include NVIDIA, Dell Technologies, Esri,
  and EPRI. Noteworthy AI is SOC 2 Type II compliant. The company publishes no public API,
  SDK, or developer surface at this time.
